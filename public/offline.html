<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <title>Offline - Hematin</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #09090b; color: #f4f4f5; }
        .card { background: #18181b; border-color: #27272a; }
        .muted { color: #a1a1aa; }
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
        padding: 32px 24px;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #e4e4e7;
      }
      .icon {
        width: 56px; height: 56px; margin: 0 auto 16px;
        border-radius: 16px; background: #d1fae5; color: #059669;
        display: flex; align-items: center; justify-content: center;
        font-size: 28px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      .muted { color: #71717a; font-size: 12px; }
      button {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 12px;
        background: #059669;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        min-height: 48px;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">⚠</div>
      <h1>Kamu sedang offline</h1>
      <p>Hematin butuh koneksi untuk memuat data terbaru. Periksa koneksi lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
      <p class="muted" style="margin-top:16px;margin-bottom:0">Data kamu tetap aman di database pribadi.</p>
    </main>
  </body>
</html>
